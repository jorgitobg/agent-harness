[project]
name = "agent-harness"
version = "0.0.1"
description = "A readable agent harness built from scratch: typed tools, guardrails, budgeted loop, memory, sub-agents, tracing and evals."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Jorge Benjumea" }]
dependencies = ["jsonschema>=4.22"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pyright>=1.1.380", "types-jsonschema"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_harness"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "BLE"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
addopts = "-q --cov=agent_harness --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
